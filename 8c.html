<!DOCTYPE html>
<html>
<head>
<title>Loops Example</title>
</head>

<body>

<h2>Numbers from 1 to 10</h2>

<script>


document.write("<b>Using FOR loop:</b><br>");
for(var i = 1; i <= 10; i++)
{
    document.write(i + "<br>");
}

document.write("<br><b>Using WHILE loop:</b><br>");
var j = 1;
while(j <= 10)
{
    document.write(j + "<br>");
    j++;
}


document.write("<br><b>Using DO-WHILE loop:</b><br>");
var k = 1;
do
{
    document.write(k + "<br>");
    k++;
}while(k <= 10);

</script>

</body>
</html>
