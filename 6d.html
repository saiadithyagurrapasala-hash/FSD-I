<!DOCTYPE html>
<html>
<head>
    <title>Voter Eligibility</title>
    <script>
        function checkVoter() {

            // Taking input using prompt
            let name = prompt("Enter your name:");
            let age = prompt("Enter your age:");

            age = parseInt(age);

            // Checking eligibility
            let status;
            if (age >= 18) {
                status = "Eligible to Vote";
            } else {
                status = "Not Eligible to Vote";
            }

            // Display in table format
            document.getElementById("result").innerHTML =
                "<table border='1' cellpadding='10'>" +
                "<tr><th>Name</th><th>Age</th><th>Status</th></tr>" +
                "<tr><td>" + name + "</td><td>" + age + "</td><td>" + status + "</td></tr>" +
                "</table>";
        }
    </script>
</head>
<body onload="checkVoter()">

<h3>Voter Information</h3>

<div id="result"></div>

</body>
</html>
