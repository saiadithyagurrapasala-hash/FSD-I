<!DOCTYPE html>
<html>
<head>
 <title>css background image</title>
</head>
<style>
body {
  background-image: url("nature.jpg");
  background-repeat: no-repeat;
  background-position: center 50%;
  background-attachment: fixed;
  background-size:50%;
  transform: rotate(360deg);
}
</style>
</head>
<body>

<h1>background image</h1>
<p>Hello !</p>
<p>This page has a tilted fixed background image!It shows a beautiful nature picture shows mountains</p>
<p>A majestic snow-capped mountain peak rises sharply against a clear blue sky.
Dark forested slopes in the foreground contrast beautifully with the bright, sunlit summit.</p>


</body>
</html>
