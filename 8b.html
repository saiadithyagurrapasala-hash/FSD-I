<!DOCTYPE html>
<html>
<head>
<title>Week Days using Switch</title>
</head>

<body>

<h2>Display Week Day</h2>

<script>
var day = parseInt(prompt("Enter a number (1-7):"));
var result;

switch(day)
{
    case 1:
        result = "Monday";
        break;
    case 2:
        result = "Tuesday";
        break;
    case 3:
        result = "Wednesday";
        break;
    case 4:
        result = "Thursday";
        break;
    case 5:
        result = "Friday";
        break;
    case 6:
        result = "Saturday";
        break;
    case 7:
        result = "Sunday";
        break;
    default:
        result = "Invalid Day";
}

document.write("<h3>" + result + "</h3>");
</script>

</body>
</html>
